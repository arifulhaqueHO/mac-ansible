---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible content
        run: ansible-lint

      - name: Check bootstrap script syntax
        run: bash -n bootstrap.sh

      - name: Check playbook syntax
        run: ansible-playbook --syntax-check site.yml

      - name: Idempotence check
        run: |
          idempotence=$(mktemp)
          ansible-playbook site.yml | tee -a "${idempotence}"
          tail "${idempotence}" | grep -q 'changed=0.*failed=0' && (echo 'Idempotence test: pass' && exit 0) || (echo 'Idempotence test: fail' && exit 1)
        env:
          ANSIBLE_FORCE_COLOR: '1'
